  background: var(--canvas-border-subtle);
}

/* generation history overlay（nodeOutputHistory.*） */
.history-overlay {
  position: fixed;
  inset: 0;
  z-index: 420;
  display: grid;
  place-items: center;
  padding: 40px;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(6px);
  animation: dialog-in 0.16s ease-out;
}

.history-overlay__panel {
  width: min(880px, calc(100vw - 80px));
  max-height: min(640px, calc(100vh - 80px));
  display: flex;
  flex-direction: column;
  border-radius: 16px;
  border: 1px solid var(--canvas-editor-border-subtle);
  background: var(--canvas-bg-primary);
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
  overflow: hidden;
}

.history-overlay__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 18px;
  border-bottom: 1px solid var(--canvas-editor-border-subtle);
}

.history-overlay__head h3 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
}

.history-overlay__sub {
  display: block;
  margin-top: 2px;
  font-size: 11px;
  color: var(--canvas-text-tertiary);
}

.history-overlay__actions {
  display: flex;
  gap: 8px;
}

.history-overlay__grid {
  flex: 1;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  padding: 16px 18px 20px;
}

.history-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px;
  border-radius: 10px;
  border: 1px solid var(--canvas-editor-border-subtle);
  background: var(--canvas-bg-secondary);
  text-align: left;
}

.history-card:hover {
  border-color: var(--canvas-border-active);
}

.history-card.is-main {
  border-color: var(--canvas-node-selection);
}

.history-card__media {
  display: block;
  aspect-ratio: 16 / 10;
  border-radius: 6px;
  overflow: hidden;
  background: var(--canvas-bg-tertiary);
}

.history-card__media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.history-card__empty {
  display: grid;
  place-items: center;
  height: 100%;
  font-size: 11px;
  color: var(--canvas-text-tertiary);
}

.history-card__meta {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 10px;
  color: var(--canvas-text-tertiary);
}

.history-card__model {
  color: var(--canvas-text-secondary);
}

.history-card__prompt {
  font-size: 11px;
  line-height: 1.45;
  color: var(--canvas-text-secondary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.history-card__badge {
  position: absolute;
  top: 12px;
  left: 12px;
  padding: 2px 6px;
  border-radius: 999px;
  background: var(--canvas-node-selection);
  color: #111;
  font-size: 9px;
  font-weight: 600;
}

/* generic dialog + media info */
.generic-dialog {
  width: min(460px, calc(100vw - 40px));
}

.generic-dialog__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 8px;
}

.generic-dialog__head h3 {
  margin: 0;
  font-size: 14px;
  font-weight: 550;
}

.generic-dialog__body {
  padding: 0 16px 14px;
}

.generic-dialog__actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 0 16px 14px;
}

.info-table {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.info-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  font-size: 12px;
}

.info-row span {
  color: var(--canvas-text-tertiary);
  flex: 0 0 82px;
}

.info-row b {
  font-weight: 450;
  color: var(--canvas-text-primary);
  text-align: right;
  word-break: break-word;
}

/* adjust popover */
.adjust-popover {
  position: absolute;
  z-index: 26;
  width: 220px;
  padding: 10px 12px 12px;
  border-radius: 10px;
  border: 1px solid var(--canvas-border-subtle);
  background: var(--canvas-bg-tertiary);
  box-shadow: var(--canvas-popover-shadow);
}

.adjust-popover[hidden] {
  display: none;
}

.adjust-popover__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 12px;
  color: var(--canvas-text-secondary);
}

.adjust-popover__head button {
  font-size: 11px;
  color: var(--canvas-text-tertiary);
}

.adjust-popover__head button:hover {
  color: var(--canvas-text-primary);
}

.adjust-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 6px 0;
  font-size: 11px;
  color: var(--canvas-text-secondary);
}

.adjust-row span {
  flex: 0 0 42px;
}

.adjust-row input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 14px;
  background: transparent;
}

.adjust-row input[type="range"]::-webkit-slider-runnable-track {
  height: 2px;
  border-radius: 2px;
  background: var(--canvas-border-subtle);
}

.adjust-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px;
  height: 10px;
  margin-top: -4px;
  border-radius: 50%;
  background: var(--canvas-node-selection);
}

.adjust-row b {
  flex: 0 0 30px;
  text-align: right;
  font-weight: 400;
  color: var(--canvas-text-primary);
  font-variant-numeric: tabular-nums;
}

/* annotate bar + annotations */
.annotate-bar {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 60;
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  gap: 2px;
  height: 40px;
  padding: 4px 8px;
  width: max-content;
  max-width: calc(100vw - 24px);
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  scrollbar-width: none;
  border-radius: 999px;
  border: 1px solid var(--canvas-border-strong, #3a3a3a);
  background: rgba(38, 38, 38, 0.86);
  backdrop-filter: blur(12px);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
}

.annotate-bar[hidden] {
  display: none;
}

.annotate-bar::-webkit-scrollbar {
  display: none;
}

.annotate-bar__label {
  flex: 0 0 auto;
  padding: 0 6px 0 4px;
  font-size: 11.5px;
  color: var(--canvas-text-secondary);
  white-space: nowrap;
}

.annotate-bar button {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border-radius: 8px;
  color: var(--canvas-text-secondary);
}

.annotate-bar button:hover {
  background: rgba(255, 255, 255, 0.08);
  color: var(--canvas-text-primary);
}

.annotate-bar button.is-active {
  background: rgba(91, 95, 199, 0.3);
  color: #9aa4ff;
}

.annotate-bar button svg {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.annotate-bar__color {
  flex: 0 0 17px !important;
  width: 17px !important;
  height: 17px !important;
  min-width: 17px;
  padding: 0;
  margin: 0 1px;
  border-radius: 50% !important;
  border: 1px solid rgba(255, 255, 255, 0.25);
  box-sizing: border-box;
}

.annotate-bar__color.is-active {
  box-shadow: 0 0 0 2px rgba(20, 20, 20, 0.9), 0 0 0 3.5px var(--canvas-node-selection);
}

.annotate-bar__sep {
  flex: 0 0 1px;
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.annotate-bar__exit {
  flex: 0 0 auto;
  width: auto !important;
  padding: 0 10px;
  font-size: 11.5px;
  white-space: nowrap;
}

body.is-annotating .canvas-board {
  cursor: crosshair;
}

.annotation-text {
  paint-order: stroke;
  stroke: rgba(0, 0, 0, 0.55);
  stroke-width: 3px;
  font-family: var(--font);
  user-select: none;
}

.annotation-arrow {
  pointer-events: none;
}

.annotation-input {
  position: absolute;
  z-index: 62;
  min-width: 180px;
  height: 30px;
  padding: 0 8px;
  border-radius: 6px;
  border: 1px solid var(--canvas-node-selection);
  background: var(--canvas-bg-tertiary);
  color: var(--canvas-text-primary);
  font-size: 12px;
  outline: none;
}

/* organize canvas prompt */
.organize-prompt {
  position: absolute;
  left: 50%;
  bottom: 74px;
  transform: translateX(-50%);
  z-index: 80;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--canvas-editor-border-subtle);
  background: var(--canvas-chrome-control-surface);
  backdrop-filter: blur(14px);
  box-shadow: var(--shadow-md, 0 8px 24px rgba(0, 0, 0, 0.4));
  font-size: 12px;
  color: var(--canvas-text-primary);
  animation: toast-in 0.16s ease-out;
}

.organize-prompt button {
  height: 26px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--canvas-editor-border-subtle);
  font-size: 11.5px;
  color: var(--canvas-text-primary);
}

.organize-prompt button[data-or="keep"] {
  background: var(--canvas-text-primary);
  color: var(--canvas-bg-primary);
  border-color: transparent;
}

/* inline rename input */
.node-label-input {
  flex: 0 1 auto;
  min-width: 80px;
  max-width: 220px;
  height: 22px;
  padding: 0 6px;
  border-radius: 4px;
  border: 1px solid rgba(204, 255, 0, 0.5);
  background: rgba(255, 255, 255, 0.08);
  color: var(--canvas-text-primary);
  font-size: 15px;
  font-weight: 500;
  outline: none;
}

/* ════════════════════════════════════════════════════════════════════════
   底部参数面板 / 素材库 / 媒体预览
   ════════════════════════════════════════════════════════════════════════ */

/* compact input panel（原站 rh-canvas-compact-input-panel） */
.param-bar {
  position: absolute;
  left: 50%;
  bottom: 64px;
  transform: translateX(-50%);
  z-index: 55;
  width: min(760px, calc(100vw - 240px));
  padding: 10px 12px 12px;
  border-radius: 14px;
  border: 1px solid var(--canvas-editor-border-subtle);
  background: color-mix(in srgb, var(--canvas-bg-primary) 94%, transparent);
  backdrop-filter: blur(18px) saturate(130%);
  box-shadow: 0 16px 44px rgba(0, 0, 0, 0.5);
  animation: param-in 0.16s ease;
}

.param-bar[hidden] {
  display: none;
}

@keyframes param-in {
  from {
    opacity: 0;
    transform: translateX(-50%) translateY(8px);
  }
}

.param-bar__head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 2px 8px;
}

.param-bar__title {
  font-size: 12.5px;
  font-weight: 550;
  color: var(--canvas-text-primary);
  max-width: 320px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.param-bar__type {
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--type-chip);
  color: rgba(255, 255, 255, 0.72);
  font-size: 9.5px;
  letter-spacing: 0.4px;
}

[data-theme="light"] .param-bar__type,
[data-theme="eyeCare"] .param-bar__type {
  color: rgba(15, 23, 42, 0.66);
}

.param-bar__help,
.param-bar__close {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  color: var(--canvas-text-tertiary);
}

.param-bar__help:hover,
.param-bar__close:hover {
  background: var(--canvas-control-hover-neutral);
  color: var(--canvas-text-primary);
}

.param-bar__help svg,
.param-bar__close svg {
  width: 13px;
  height: 13px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.param-bar__prompt-row {
  display: flex;
  gap: 8px;
  align-items: stretch;
}

.param-bar__prompt {
  flex: 1;
  min-width: 0;
  resize: none;
  min-height: 46px;
  max-height: 120px;
  padding: 8px 10px;
  border-radius: 9px;
  border: 1px solid var(--canvas-editor-border-subtle);
  background: rgba(255, 255, 255, 0.045);
  color: var(--canvas-text-primary);
  font: inherit;
  font-size: 12.5px;
  line-height: 1.5;
  outline: none;
}

[data-theme="light"] .param-bar__prompt,
[data-theme="eyeCare"] .param-bar__prompt {
  background: rgba(15, 23, 42, 0.04);
}

.param-bar__prompt:focus {
  border-color: var(--canvas-border-active);
}

.param-bar__prompt-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 76px;
}

.param-bar__enhance {
  height: 22px;
  border-radius: 6px;
  border: 1px solid var(--canvas-editor-border-subtle);
  color: var(--canvas-text-secondary);
  font-size: 11px;
}

.param-bar__enhance:hover {
  background: var(--canvas-control-hover-neutral);
  color: var(--canvas-text-primary);
}

.param-bar__run {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  border-radius: 8px;
  background: var(--canvas-text-primary);
  color: var(--canvas-bg-primary);
  font-size: 12px;
  font-weight: 600;
}

.param-bar__run:hover {
  opacity: 0.9;
}

.param-bar__run:disabled {
  opacity: 0.4;
  pointer-events: none;
}

.param-bar__run svg {
  width: 10px;
  height: 10px;
  fill: currentColor;
}

.param-bar__controls {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 10px;
  padding-top: 10px;
}

.param-field {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--canvas-text-tertiary);
}

.param-field select,
.param-field input {
  height: 26px;
  padding: 0 6px;
  border-radius: 6px;
  border: 1px solid var(--canvas-editor-border-subtle);
  background: rgba(255, 255, 255, 0.05);
  color: var(--canvas-text-primary);
  font-size: 11.5px;
  outline: none;
}

[data-theme="light"] .param-field select,
[data-theme="light"] .param-field input,
[data-theme="eyeCare"] .param-field select,
[data-theme="eyeCare"] .param-field input {
  background: rgba(15, 23, 42, 0.04);
}

.param-field input[type="number"] {
  width: 88px;
}

.param-field input[type="text"] {
  width: 150px;
}

/* asset library（本地素材库） */
.asset-library {
  position: absolute;
  left: 88px;
  top: 72px;
  bottom: 66px;
  z-index: 70;
  width: 300px;
  display: flex;
  flex-direction: column;
  border-radius: 14px;
  border: 1px solid var(--canvas-editor-border-subtle);
  background: color-mix(in srgb, var(--canvas-bg-tertiary) 96%, transparent);
  backdrop-filter: blur(20px);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
  overflow: hidden;
  animation: manager-in 0.16s ease;
}

.asset-library[hidden] {
  display: none;
}

.asset-library__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 12px 8px 14px;
}

.asset-library__title {
  font-size: 13px;
  font-weight: 550;
}

.asset-library__count {
  margin-left: 6px;
  font-size: 11px;
  color: var(--canvas-text-tertiary);
}

.asset-library__tabs {
  display: flex;
  gap: 2px;
  padding: 0 10px 8px;
}

.asset-library__tabs button {
  height: 26px;
  padding: 0 9px;
  border-radius: 6px;
  color: var(--canvas-text-secondary);
  font-size: 11px;
}

.asset-library__tabs button:hover {
  background: var(--canvas-control-hover-neutral);
}

.asset-library__tabs button.is-active {
  background: rgba(91, 95, 199, 0.24);
  color: #9aa4ff;
}

.asset-library__search {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0 12px 8px;
  height: 30px;
  padding: 0 9px;
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.05);
}

.asset-library__search svg {
  width: 13px;
  height: 13px;
  fill: none;
  stroke: var(--canvas-text-tertiary);
  stroke-width: 1.8;
}

.asset-library__search input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  background: transparent;
  font-size: 12px;
}

.asset-library__grid {
  flex: 1;
  overflow-y: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 0 10px 10px;
  align-content: start;
}

.asset-library__grid::-webkit-scrollbar {
  width: 6px;
}

.asset-library__grid::-webkit-scrollbar-thumb {
  background: var(--canvas-border-subtle);
  border-radius: 3px;
}

.asset-library__empty {
  grid-column: 1 / -1;
  padding: 26px 12px;
  text-align: center;
  color: var(--canvas-text-tertiary);
  font-size: 11.5px;
  line-height: 1.6;
}

.asset-cell {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 5px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: rgba(255, 255, 255, 0.03);
  text-align: left;
  cursor: grab;
}

.asset-cell:hover {
  border-color: var(--canvas-border-active);
}

.asset-cell__thumb {
  position: relative;
  display: block;
  aspect-ratio: 4 / 3;
  border-radius: 5px;
  overflow: hidden;
  background: var(--canvas-bg-secondary);
}

.asset-cell__thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.asset-cell__audio {
  display: grid;
  place-items: center;
  height: 100%;
  color: var(--canvas-text-tertiary);
}

.asset-cell__audio svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
}

.asset-cell__badge {
  position: absolute;
  right: 4px;
  bottom: 4px;
  padding: 1px 5px;
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  font-size: 9px;
}

.asset-cell__label {
  font-size: 10.5px;
  color: var(--canvas-text-secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.asset-library__foot {
  padding: 8px 12px;
  border-top: 1px solid var(--canvas-editor-border-subtle);
  color: var(--canvas-text-tertiary);
  font-size: 10px;
}

/* node play badge */
.node__play {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 40px;
  height: 40px;
  margin: -20px 0 0 -20px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.35);
  backdrop-filter: blur(4px);
  pointer-events: none;
}

.node__play svg {
  width: 16px;
  height: 16px;
  fill: rgba(255, 255, 255, 0.9);
}

/* media preview overlay */
.preview-overlay {
  position: fixed;
  inset: 0;
  z-index: 430;
  display: grid;
  place-items: center;
  padding: 40px;
  background: rgba(0, 0, 0, 0.62);
  backdrop-filter: blur(8px);
  animation: dialog-in 0.16s ease-out;
}

.preview-overlay__panel {
  width: min(880px, calc(100vw - 80px));
  max-height: calc(100vh - 80px);
  display: flex;
  flex-direction: column;
  border-radius: 16px;
  border: 1px solid var(--canvas-editor-border-subtle);
  background: var(--canvas-bg-primary);
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
  overflow: hidden;
}

.preview-overlay__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--canvas-editor-border-subtle);
}

.preview-overlay__head h3 {
  margin: 0;
  font-size: 14px;
  font-weight: 550;
}

.preview-overlay__head span {
  font-size: 11px;
  color: var(--canvas-text-tertiary);
}

.preview-overlay__actions {
  display: flex;
  gap: 8px;
}

.preview-overlay__media {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  background: #000;
  overflow: hidden;
}

.preview-overlay__media img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  display: block;
}

.preview-overlay__info {
  padding: 10px 18px 14px;
  border-top: 1px solid var(--canvas-editor-border-subtle);
}

/* ════════════════════════════════════════════════════════════════════════
   生成队列 / 图片裁剪 / 视频精确编辑 / 节点标注渲染
   ════════════════════════════════════════════════════════════════════════ */

/* queue badge on the rail */
.canvas-toolbar__badge {
  position: absolute;
  top: 2px;
  right: 1px;
  min-width: 13px;
  height: 13px;
  padding: 0 3px;
  border-radius: 999px;
  background: var(--canvas-accent-warning);
  color: #1a1300;
  font-size: 9px;
  font-weight: 700;
  line-height: 13px;
  text-align: center;
}

.canvas-toolbar__btn {
  position: relative;
}

/* queue panel */
.queue-panel {
  position: absolute;
  right: 16px;
  bottom: 56px;
  z-index: 72;
  width: 280px;
  max-height: 320px;
  display: flex;
  flex-direction: column;
  border-radius: 12px;
  border: 1px solid var(--canvas-editor-border-subtle);
  background: color-mix(in srgb, var(--canvas-bg-tertiary) 96%, transparent);
  backdrop-filter: blur(18px);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
  overflow: hidden;
  animation: manager-in 0.16s ease;
}

.queue-panel[hidden] {
  display: none;
}

.queue-panel__head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 10px 8px 12px;
  font-size: 12px;
}

.queue-panel__title {
  font-weight: 550;
}

.queue-panel__count {
  color: var(--canvas-text-tertiary);
  font-size: 10.5px;
}

.queue-panel__btn {
  display: grid;
  place-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: 6px;
  color: var(--canvas-text-tertiary);
  font-size: 11px;
}

.queue-panel__btn:hover {
  background: var(--canvas-control-hover-neutral);
  color: var(--canvas-text-primary);
}

.queue-panel__btn svg {
  width: 12px;
  height: 12px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
}

.queue-panel__list {
  flex: 1;
  overflow-y: auto;
  padding: 0 6px 8px;
}

.queue-panel__empty {
  padding: 18px 10px;
  color: var(--canvas-text-tertiary);
  font-size: 11px;
  line-height: 1.6;
  text-align: center;
}

.queue-job {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 7px;
  font-size: 11.5px;
  color: var(--canvas-text-secondary);
}

.queue-job:hover {
  background: rgba(255, 255, 255, 0.04);
}

.queue-job__dot {
  width: 6px;
  height: 6px;
  flex: 0 0 6px;
  border-radius: 50%;
  background: var(--canvas-text-tertiary);
}

.queue-job.is-running .queue-job__dot {
  background: var(--canvas-accent-warning);
  animation: status-blink 1s ease-in-out infinite;
}

.queue-job.is-done .queue-job__dot {
  background: #9fe870;
}

.queue-job.is-error .queue-job__dot,
.queue-job.is-cancelled .queue-job__dot {
  background: var(--canvas-accent-danger);
}

.queue-job__title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--canvas-text-primary);
}

.queue-job__status {
  font-size: 10px;
  color: var(--canvas-text-tertiary);
}

.queue-job__cancel {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  color: var(--canvas-text-tertiary);
  font-size: 14px;
  line-height: 1;
}

.queue-job__cancel:hover {
  background: rgba(239, 68, 68, 0.15);
  color: var(--canvas-accent-danger);
}

/* crop overlay */
.crop-overlay,
.pe-overlay {
  position: fixed;
  inset: 0;
  z-index: 440;
  display: grid;
  place-items: center;
  padding: 32px;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(6px);
}

.crop-overlay__panel,
.pe-panel {
  width: min(920px, calc(100vw - 64px));
  max-height: calc(100vh - 64px);
  display: flex;
  flex-direction: column;
  border-radius: 14px;
  border: 1px solid var(--canvas-editor-border-subtle);
  background: var(--canvas-bg-primary);
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
  overflow: hidden;
}

.crop-overlay__head,
.pe-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--canvas-editor-border-subtle);
  font-size: 13px;
}

.crop-overlay__head > div,
.pe-actions {
  display: flex;
  gap: 8px;
}

.crop-stage {
  position: relative;
  display: grid;
  place-items: center;
  padding: 18px;
  min-height: 240px;
  background: #000;
  overflow: hidden;
}

.crop-stage img {
  max-width: 100%;
  max-height: 60vh;
  display: block;
  user-select: none;
}

.crop-rect {
  position: absolute;
  border: 1.5px solid var(--canvas-text-primary);
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
  pointer-events: none;
}

/* precision edit */
.pe-tools {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
  border-bottom: 1px solid var(--canvas-editor-border-subtle);
}

.pe-tools button {
  height: 26px;
  padding: 0 10px;
  border-radius: 6px;
  border: 1px solid transparent;
  color: var(--canvas-text-secondary);
  font-size: 11.5px;
}

.pe-tools button:hover {
  background: var(--canvas-control-hover-neutral);
  color: var(--canvas-text-primary);
}

.pe-tools button.is-active {
  background: rgba(91, 95, 199, 0.26);
  border-color: rgba(124, 138, 246, 0.4);
  color: #9aa4ff;
}

.pe-color {
  width: 16px !important;
  height: 16px !important;
  padding: 0 !important;
  border-radius: 50% !important;
  border: 1px solid rgba(255, 255, 255, 0.25) !important;
}

.pe-color.is-active {
  box-shadow: 0 0 0 2px var(--canvas-bg-primary), 0 0 0 3.5px var(--canvas-node-selection);
}

.pe-sep {
  width: 1px;
  height: 16px;
  margin: 0 6px;
  background: var(--canvas-editor-border-subtle);
}

.pe-stage {
  position: relative;
  display: grid;
  place-items: center;
  background: #000;
  min-height: 260px;
  overflow: hidden;
  cursor: crosshair;
}

.pe-stage img {
  max-width: 100%;
  max-height: 56vh;
  display: block;
  user-select: none;
}

.pe-stage svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.pe-foot {
  display: flex;
  gap: 8px;
  padding: 10px 14px 12px;
  border-top: 1px solid var(--canvas-editor-border-subtle);
}

.pe-foot textarea {
  flex: 1;
  min-height: 44px;
  max-height: 90px;
  resize: none;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--canvas-editor-border-subtle);
  background: rgba(255, 255, 255, 0.05);
  color: var(--canvas-text-primary);
  font: inherit;
  font-size: 12px;
  outline: none;
}

/* saved edits rendered on node media */
.node__edits {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* ════════════════════════════════════════════════════════════════════════
   API 状态 / APIMart 面板
   ════════════════════════════════════════════════════════════════════════ */

.api-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 10px;
  margin-right: 4px;
  border-radius: 999px;
  border: 1px solid var(--canvas-editor-border-subtle);
  background: rgba(255, 255, 255, 0.04);
  color: var(--canvas-text-secondary);
  font-size: 11px;
  font-weight: 500;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.api-chip:hover {
  background: var(--canvas-chrome-control-hover);
  color: var(--canvas-text-primary);
}

.api-chip__dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--canvas-text-tertiary);
}

.api-chip.is-online .api-chip__dot {
  background: #4ade80;
  box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.15);
}

.api-chip.is-online {
  color: #b7f0c9;
  border-color: rgba(74, 222, 128, 0.25);
}

.api-chip.is-offline .api-chip__dot {
  background: var(--canvas-accent-danger);
}

.api-chip.is-offline {
  color: rgba(239, 68, 68, 0.85);
  border-color: rgba(239, 68, 68, 0.25);
}

[data-theme="light"] .api-chip.is-online,
[data-theme="eyeCare"] .api-chip.is-online {

}

.api-panel {
  width: min(520px, calc(100vw - 40px));
}

.api-panel .info-row span {
  flex: 0 0 72px;
}

.api-toggles {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 14px 0 4px;
  padding-top: 12px;
  border-top: 1px solid var(--canvas-editor-border-subtle);
  font-size: 12px;
  color: var(--canvas-text-secondary);
}

.api-toggles label {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.api-toggles input {
  accent-color: var(--canvas-node-selection);
}

.api-hint {
  margin: 10px 0 0;
  font-size: 10.5px;
  line-height: 1.6;
  color: var(--canvas-text-tertiary);
}

.api-hint code {
  padding: 1px 4px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.06);
  font-family: var(--mono);
  font-size: 10px;
}

.preview-overlay__media video {
  max-width: 100%;
  max-height: 100%;
  display: block;
}

/* remote-media loading shimmer used by image/video nodes */
.node__media img[src^="http"] {
  background: var(--canvas-bg-secondary);
}


/* 参数面板：智能模型提示 / 能力标签 */
.param-hint {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 8px 2px 0;
  font-size: 10.5px;
  color: var(--canvas-text-tertiary);
}

.param-hint:empty {
  display: none;
}

.param-hint__rec {
  color: var(--canvas-text-tertiary);
}

.param-hint__chips {
  display: inline-flex;
  gap: 4px;
}

.param-hint__chips i {
  padding: 1px 5px;
  border-radius: 4px;
  background: rgba(91, 95, 199, 0.18);
  color: #9aa4ff;
  font-style: normal;
  font-size: 9.5px;
}

.param-hint__warn {
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(245, 158, 11, 0.14);
  color: #fbbf24;
}

.param-hint__ok {
  color: #6ee7a8;
}

.api-actions-row {
  display: flex;
  justify-content: flex-end;
  margin-top: 10px;
}


.param-bar__help--text {
  width: auto;
  padding: 0 8px;
  white-space: nowrap;
  font-size: 11px;
  color: var(--canvas-text-secondary);
}

/* 标注：选中态（箭头端点手柄 / 文字选框）与工具条字号 */
.annotation-handle {
  fill: var(--canvas-bg-primary);
  stroke: var(--canvas-node-selection);
  stroke-width: 2;
}

.annotation-select-box {
  fill: none;
  stroke: var(--canvas-node-selection);
  stroke-width: 1.5;
  stroke-dasharray: 4 3;
  pointer-events: none;
}

.annotate-bar__size {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0 4px;
  font-size: 11px;
  color: var(--canvas-text-tertiary);
  white-space: nowrap;
}

.annotate-bar__size select {
  flex: 0 0 auto;
  width: 62px;
  height: 24px;
  padding: 0 4px;
  border-radius: 6px;
  border: 1px solid var(--canvas-editor-border-subtle);
  background: var(--canvas-chrome-control);
  color: var(--canvas-text-primary);
  font-size: 11px;
  outline: none;
}

.annotate-bar__size select:disabled {
  opacity: 0.4;
}

.annotate-bar__delete.is-disabled {
  opacity: 0.35;
  pointer-events: none;
}

.annotate-bar.has-selection {
  border-color: color-mix(in srgb, var(--canvas-node-selection) 55%, transparent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--canvas-node-selection) 35%, transparent), var(--canvas-popover-shadow);
}

/* 窄视口：标注工具条下移，避免压住顶部标题/API 胶囊 */
@media (max-width: 1080px) {
  .annotate-bar {
    top: 64px;
  }
}

/* 生成中的节点以琥珀色状态框为准，避免和选中灰框叠成两层 */
.node.is-running.is-selected .node__card {
  border-color: rgba(251, 191, 36, 0.9);
  box-shadow:
    0 0 0 1px rgba(251, 191, 36, 0.3),
    0 0 20px rgba(251, 191, 36, 0.12);
}

.node.is-queued.is-selected .node__card {
  border-color: rgba(251, 191, 36, 0.45);
  box-shadow: none;
}

  var api = {
    state: {
      online: false,
      hasKey: false,
      base: "",
      models: [],
      byKind: { text: [], image: [], video: [], audio: [], other: [] },
      balance: null,
      error: "",
      checkedAt: 0
    },
    async init() {
      try {
        const r = await fetch("/api/health", { cache: "no-store" });
        const h = await r.json();
        this.state.online = !!h.ok;
        this.state.hasKey = !!h.hasKey;
        this.state.base = h.base || "";
        this.state.error = h.ok ? "" : "API \u672A\u8FDE\u63A5";
        if (h.ok) await this.loadModels();
        else this._applyStaticCatalog();
        this.state.checkedAt = Date.now();
        return this.state;
      } catch (err) {
        this.state.online = false;
        this.state.error = err.message || "\u672C\u5730\u4EE3\u7406\u672A\u542F\u52A8";
        this._applyStaticCatalog();
        return this.state;
      }
    },
    async loadModels() {
      try {
        const r = await fetch("/api/models?expand=category", { cache: "no-store" });
        const d = await r.json();
        const models = Array.isArray(d.data) ? d.data : [];
        if (models.length && models.some((m) => m.category)) {
          this.state.models = models;
          this._index(models);
          return models;
        }
      } catch {
      }
      this._applyStaticCatalog();
      return this.state.models;
    },
    _applyStaticCatalog() {
      const byKind = { text: [], image: [], video: [], audio: [], other: [] };
      const meta = {};
      for (const kind of ["image", "video", "chat", "audio"]) {
        for (const m of MODEL_CATALOG.models[kind] || []) {
          const target = kind === "chat" ? "text" : kind;
          byKind[target].push(m.id);
          meta[m.id] = { kind, tags: m.tags || [], canRef: !!m.canRef };
        }
      }
      this.state.byKind = byKind;
      this.state.meta = meta;
      this.state.models = Object.keys(meta).map((id) => ({ id }));
      this.state.staticCatalog = true;
    },
    /** normalize live metadata into byKind + meta; mirrors scripts/audit-models.mjs filters */
    _index(models) {
      const NON_CHAT = /babbage|davinci|embedding|embed|ocr|moderation|rerank|whisper|tts|transcri|image|video|audio|music|suno|flowmusic/i;
      const NON_TTS = /whisper|transcri|audio-preview/i;
      const NON_IMAGE = /video|music|suno|tts|chat|embedding|whisper/i;
      const NON_VIDEO = /image(?!.*video)|chat|tts|embedding|whisper/i;
      const byKind = { text: [], image: [], video: [], audio: [], other: [] };
      const meta = {};
      for (const m of models) {
        const cat = m.category;
        if (!cat || cat === "unknown") {
          const CHAT_FAMILY = /^(deepseek|qwen|glm|moonshot|kimi|grok|mistral|llama|yi-|baichuan|doubao|minimax-m)/i;
          const LEGACY = /^text-(ada|babbage|curie|davinci)/i;
          if (CHAT_FAMILY.test(m.id) && !LEGACY.test(m.id)) {
            byKind.text.push(m.id);
            meta[m.id] = { kind: "text", tags: ["text"], canRef: false, rawTags: ["family-fallback"] };
          } else {
            byKind.other.push(m.id);
          }
          continue;
        }
        const tags = normalizeTags(m.capability_tags || []);
        let id = m.id;
        let keep = true;
        if (cat === "image" && NON_IMAGE.test(id)) keep = false;
        if (cat === "video" && NON_VIDEO.test(id)) keep = false;
        if (cat === "chat" && NON_CHAT.test(id)) keep = false;
        if (cat === "audio" && NON_TTS.test(id)) keep = false;
        if (!keep) continue;
        const target = cat === "chat" ? "text" : cat;
        byKind[target].push(id);
        meta[id] = {
          kind: cat === "chat" ? "text" : cat,
          tags,
          canRef: cat === "video" ? tags.includes("i2v") || tags.includes("v2v") : tags.includes("i2i"),
          rawTags: m.capability_tags || [],
          endpoint: m.parameters?.endpoint || null
        };
      }
      const uniq = (a) => [...new Set(a)];
      for (const k of Object.keys(byKind)) byKind[k] = uniq(byKind[k]);
      this.state.byKind = byKind;
      this.state.meta = meta;
      this.state.staticCatalog = false;
    },
    async balance() {
      try {
        const r = await fetch("/api/balance", { cache: "no-store" });
        this.state.balance = await r.json();
        return this.state.balance;
      } catch {
        return null;
      }
    },
    models(kind, fallback = []) {
      const list = this.state.byKind?.[kind] || [];
      return list.length ? list : fallback;
    },
    /** 某类节点可用的模型（按推荐度排序）；hasRefs=true 时只保留支持参考图/首帧的模型 */
    modelsFor(kind, { hasRefs = false } = {}) {
      const list = this.state.byKind?.[kind] || [];
      const meta = this.state.meta || {};
      const filtered = hasRefs ? list.filter((id) => meta[id]?.canRef) : list;
      const base = filtered.length ? filtered : list;
      const pref = this.state.pref?.[kind] || PREFERENCE[kind] || [];
      return [...base].sort((a, b) => {
        const ra = pref.indexOf(a);
        const rb = pref.indexOf(b);
        return (ra === -1 ? 999 : ra) - (rb === -1 ? 999 : rb) || a.localeCompare(b);
      });
    },
    recommend(kind, { hasRefs = false } = {}) {
      return this.modelsFor(kind, { hasRefs })[0] || "";
    },
    modelMeta(id) {
      return this.state.meta?.[id] || null;
    },
    /** 能力标签（中文），用于参数面板提示 */
    modelChips(id) {
      const meta = this.modelMeta(id);
      const map = {
        t2i: "\u6587\u751F\u56FE",
        i2i: "\u56FE\u751F\u56FE / \u53C2\u8003\u56FE",
        t2v: "\u6587\u751F\u89C6\u9891",
        i2v: "\u56FE\u751F\u89C6\u9891",
        v2v: "\u89C6\u9891\u751F\u89C6\u9891",
        t2a: "\u6587\u751F\u97F3\u9891",
        a2a: "\u97F3\u9891\u751F\u97F3\u9891",
        text: "\u6587\u672C",
        vision: "\u89C6\u89C9\u7406\u89E3"
      };
      const kind = meta?.kind;
      const tags = (meta?.tags || []).filter((t) => !(kind !== "text" && t === "text")).map((t) => map[t]).filter(Boolean);
      return [...new Set(tags)];
    },
    supportsRef(id) {
      return !!this.modelMeta(id)?.canRef;
    },
    async _json(path, body, { signal, method = "POST" } = {}) {
      const timeout = AbortSignal.timeout(12e4);
      const merged = signal ? AbortSignal.any([signal, timeout]) : timeout;
      const r = await fetch(path, {
        method,
        headers: { "content-type": "application/json" },
        body: body ? JSON.stringify(body) : void 0,
        signal: merged
      });
      const text = await r.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch {
        throw new ApiError(`\u8FD4\u56DE\u4E0D\u662F JSON\uFF08HTTP ${r.status}\uFF09\uFF1A${text.slice(0, 160)}`, r.status);
      }
      if (!r.ok || data?.error || data?.code >= 400) {
        const msg = data?.error?.message || data?.message || `HTTP ${r.status}`;
        throw new ApiError(msg, r.status, data?.error?.code);
      }
      return data;
    },
    async chat({ model, messages, temperature = 0.7, max_tokens = 1024, signal }) {
      return this._json("/api/chat", { model, messages, temperature, max_tokens, stream: false }, { signal });
    },
    async submitImage({ model, prompt, size = "1:1", resolution = "1K", seed, image_urls, negative_prompt }) {
      const body = { model, prompt, size, resolution };
      if (seed != null && seed !== -1) body.seed = Number(seed);
      if (Array.isArray(image_urls) && image_urls.length) body.image_urls = image_urls.map((url) => ({ url }));
      if (negative_prompt) body.negative_prompt = negative_prompt;
      const d = await this._json("/api/images", body);
      return extractTaskId(d);
    },
    async submitVideo({ model, prompt, size = "16:9", resolution = "720p", duration = 5, generate_audio = false, seed, image_urls }) {
      const body = { model, prompt, size, resolution, duration: Number(duration) };
      if (generate_audio) body.generate_audio = true;
      if (seed != null && seed !== -1) body.seed = Number(seed);
      if (Array.isArray(image_urls) && image_urls.length) body.image_urls = image_urls.map((url) => ({ url }));
      const d = await this._json("/api/videos", body);
      return extractTaskId(d);
    },
    async getTask(id) {
      return this._json(`/api/tasks/${encodeURIComponent(id)}`, null, { method: "GET" });
    },
    /**
     * Poll an async task until it finishes. `onProgress(pct, status)` reports.
     * APIMart statuses seen: submitted / pending / processing / completed / failed.
     */
    async waitTask(taskId, { onProgress, signal, intervalMs = 2500, timeoutMs = 15 * 60 * 1e3 } = {}) {
      const started = Date.now();

    /* ══════════ 图片裁剪（本地 canvas 裁剪） ══════════ */
    startCrop(node) {
      const media = nodeMainMedia(node);
      if (!media) {
        store.emit("toast", "\u8BE5\u8282\u70B9\u8FD8\u6CA1\u6709\u53EF\u88C1\u526A\u7684\u56FE\u7247", "error");

      if (this.cropEl) this.cropEl.remove();
      const el2 = document.createElement("div");

      el2.innerHTML = `
      <div class="crop-overlay__panel">
        <header class="crop-overlay__head">
          <span>\u88C1\u526A \xB7 ${escapeHTML2(nodeTitle(node))}</span>
          <div><button class="btn" data-crop="cancel">\u53D6\u6D88</button><button class="btn btn--primary" data-crop="apply">\u5E94\u7528\u88C1\u526A</button></div>
        </header>
        <div class="crop-stage" id="cropStage">
          <img id="cropImg" src="${media}" alt="" draggable="false" />
          <div class="crop-rect" id="cropRect" hidden></div>
        </div>
      </div>`;
      document.body.appendChild(el2);
      this.cropEl = el2;
      const stage = el2.querySelector("#cropStage");
      const img = el2.querySelector("#cropImg");
      const rectEl = el2.querySelector("#cropRect");
      let start = null;
      let selection = null;
      const updateRect = () => {
        if (!selection) return;
        const r = stage.getBoundingClientRect();
        rectEl.hidden = false;
        rectEl.style.left = `${Math.min(selection.x1, selection.x2) - r.left}px`;
        rectEl.style.top = `${Math.min(selection.y1, selection.y2) - r.top}px`;
        rectEl.style.width = `${Math.abs(selection.x2 - selection.x1)}px`;
        rectEl.style.height = `${Math.abs(selection.y2 - selection.y1)}px`;
      };
      stage.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        const r = stage.getBoundingClientRect();
        start = { x: e.clientX - r.left, y: e.clientY - r.top };
        selection = { x1: e.clientX, y1: e.clientY, x2: e.clientX, y2: e.clientY };
        updateRect();
      });
      stage.addEventListener("pointermove", (e) => {
        if (!start) return;
        selection.x2 = e.clientX;
        selection.y2 = e.clientY;
        updateRect();
      });
      window.addEventListener("pointerup", () => {
        start = null;
      }, { once: true });
      el2.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-crop]");
        if (!btn) return;
        if (btn.dataset.crop === "cancel") {
          el2.remove();
          this.cropEl = null;
          return;
        }
        if (btn.dataset.crop === "apply") {
          if (!selection || Math.abs(selection.x2 - selection.x1) < 12 || Math.abs(selection.y2 - selection.y1) < 12) {
            store.emit("toast", "\u8BF7\u5148\u5728\u56FE\u7247\u4E0A\u6846\u9009\u88C1\u526A\u533A\u57DF");
            return;
          }
          this.applyCrop(node, img, stage, selection);
          el2.remove();
          this.cropEl = null;
        }
      });
    }
    applyCrop(node, img, stage, selection) {
      const ir = img.getBoundingClientRect();
      const sr = stage.getBoundingClientRect();
      const x = Math.min(selection.x1, selection.x2) - ir.left;
      const y = Math.min(selection.y1, selection.y2) - ir.top;
      const w = Math.abs(selection.x2 - selection.x1);
      const h = Math.abs(selection.y2 - selection.y1);
      const sx = x / ir.width * img.naturalWidth;
      const sy = y / ir.height * img.naturalHeight;
      const sw = w / ir.width * img.naturalWidth;
      const sh = h / ir.height * img.naturalHeight;
      const canvas2 = document.createElement("canvas");
      canvas2.width = Math.max(16, Math.round(sw));
      canvas2.height = Math.max(16, Math.round(sh));
      const ctx = canvas2.getContext("2d");
      ctx.drawImage(img, Math.max(0, sx), Math.max(0, sy), sw, sh, 0, 0, canvas2.width, canvas2.height);
      const dataURL = canvas2.toDataURL("image/png");
      store.transaction((s) => {
        const n = s.nodes.find((x2) => x2.id === node.id);
        if (!n) return;
        const list = Array.isArray(n.data.history) ? [...n.data.history] : [];
        list.push({
          id: `crop_${Date.now()}`,
          media: dataURL,
          prompt: n.data.prompt || "",
          model: "local-crop",
          seed: "",
          at: Date.now(),
          kind: "image"
        });
        n.data = { ...n.data, media: dataURL, history: list, mainIndex: list.length - 1, status: "success" };
      }, { history: true, reason: "crop" });
      store.emit("toast", "\u88C1\u526A\u5B8C\u6210\uFF0C\u5DF2\u751F\u6210\u65B0\u7248\u672C", "success");
    }

        ["brush", "\u753B\u7B14"],
        ["arrow", "\u7BAD\u5934"],
        ["text", "\u6587\u5B57"],
        ["erase", "\u6A61\u76AE"],

      ].map(([k, label]) => `<button data-pe-tool="${k}">${label}</button>`).join("")}
          <span class="pe-sep"></span>
          ${["#f87171", "#fbbf24", "#4ade80", "#60a5fa", "#a78bfa"].map((c) => `<button class="pe-color" data-pe-color="${c}" style="background:${c}"></button>`).join("")}
        </div>
        <div class="pe-stage" id="peStage">
          <img id="peImg" src="${media}" alt="" draggable="false" />
          <svg id="peSvg" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
        </div>
        <div class="pe-foot">
          <textarea id="pePrompt" placeholder="\u63CF\u8FF0\u9700\u8981\u5728\u753B\u9762\u4E2D\u4FEE\u6539\u7684\u5185\u5BB9\uFF08\u53EF\u52A0\u5165\u63D0\u793A\u8BCD\uFF09"></textarea>
          <button class="btn" data-pe="addPrompt">\u52A0\u5165\u63D0\u793A\u8BCD</button>
        </div>
      </div>`;
      document.body.appendChild(el2);
      this.peEl = el2;
      const stage = el2.querySelector("#peStage");
      const svg2 = el2.querySelector("#peSvg");
      const input = el2.querySelector("#pePrompt");
      const norm = (e) => {
        const r = stage.getBoundingClientRect();
        return { x: (e.clientX - r.left) / r.width * 1e3, y: (e.clientY - r.top) / r.height * 1e3 };
      };
      const renderShapes = () => {
        svg2.innerHTML = "";
        for (const sh of shapes) {
          let node2 = null;
          if (sh.type === "rect") {
            node2 = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            node2.setAttribute("x", sh.x);
            node2.setAttribute("y", sh.y);
            node2.setAttribute("width", sh.w);
            node2.setAttribute("height", sh.h);
            node2.setAttribute("fill", "none");
            node2.setAttribute("stroke", sh.color);
            node2.setAttribute("stroke-width", "3");
          } else if (sh.type === "arrow") {
            node2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
            node2.setAttribute("x1", sh.x1);
            node2.setAttribute("y1", sh.y1);
            node2.setAttribute("x2", sh.x2);
            node2.setAttribute("y2", sh.y2);
            node2.setAttribute("stroke", sh.color);
            node2.setAttribute("stroke-width", "4");
            node2.setAttribute("marker-end", "url(#peArrow)");
          } else if (sh.type === "brush") {
            node2 = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
            node2.setAttribute("points", sh.points.map((p2) => p2.join(",")).join(" "));
            node2.setAttribute("fill", "none");
            node2.setAttribute("stroke", sh.color);
            node2.setAttribute("stroke-width", "5");
            node2.setAttribute("stroke-linecap", "round");
          } else if (sh.type === "text") {
            node2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
            node2.setAttribute("x", sh.x);
            node2.setAttribute("y", sh.y);
            node2.setAttribute("fill", sh.color);
            node2.setAttribute("font-size", "34");
            node2.textContent = sh.text;
          } else if (sh.type === "marker") {
            node2 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            node2.setAttribute("cx", sh.x);
            node2.setAttribute("cy", sh.y);
            node2.setAttribute("r", "22");
            node2.setAttribute("fill", sh.color);
            node2.setAttribute("opacity", "0.6");
          }
          if (node2) svg2.appendChild(node2);
        }
        if (draft) {
          const n = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          n.setAttribute("cx", draft.x);
          n.setAttribute("cy", draft.y);
          n.setAttribute("r", "6");
          n.setAttribute("fill", color);
          svg2.appendChild(n);
        }
      };
      const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
      defs.innerHTML = `<marker id="peArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="${color}"/></marker>`;
      svg2.appendChild(defs);
      let start = null;
      let current = null;
      stage.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        const p2 = norm(e);
        if (tool === "erase") {
          const before = shapes.slice();
          const idx = shapes.findIndex((sh) => {
            if (sh.type === "rect") return p2.x >= sh.x && p2.x <= sh.x + sh.w && p2.y >= sh.y && p2.y <= sh.y + sh.h;
            if (sh.type === "marker") return Math.hypot(p2.x - sh.x, p2.y - sh.y) < 40;
            if (sh.type === "text") return Math.hypot(p2.x - sh.x, p2.y - sh.y) < 60;
            return false;
          });
          if (idx >= 0) {
            undoStack.push(before);
            redoStack = [];
            shapes.splice(idx, 1);
            renderShapes();
          }
          return;
        }
        start = p2;
        if (tool === "rect") {
          current = { type: "rect", x: p2.x, y: p2.y, w: 0, h: 0, color };
        } else if (tool === "arrow") {
          current = { type: "arrow", x1: p2.x, y1: p2.y, x2: p2.x, y2: p2.y, color };
        } else if (tool === "brush") {
          current = { type: "brush", points: [[p2.x, p2.y]], color };
        } else if (tool === "marker") {
          shapes.push({ type: "marker", x: p2.x, y: p2.y, color });
          renderShapes();
        } else if (tool === "text") {
          const text = window.prompt("\u8F93\u5165\u6807\u6CE8\u6587\u5B57", "\u8FD9\u91CC\u8981\u6539");
          if (text) {
            shapes.push({ type: "text", x: p2.x, y: p2.y, text: text.slice(0, 30), color });
            renderShapes();
          }
          start = null;
        }
        if (current && !shapes.includes(current)) renderShapes();
      });
      stage.addEventListener("pointermove", (e) => {
        if (!start || !current) return;
        const p2 = norm(e);
        if (current.type === "rect") {
          current.w = p2.x - current.x;
          current.h = p2.y - current.y;
        } else if (current.type === "arrow") {
          current.x2 = p2.x;
          current.y2 = p2.y;
        } else if (current.type === "brush") {
          current.points.push([p2.x, p2.y]);
        }
        draft = p2;
        renderShapes();
      });
      const finish = () => {
        if (!current) return;
        undoStack.push(shapes.slice());
        shapes.push(current);
        current = null;
        start = null;
        redoStack = [];
        renderShapes();
      };
      stage.addEventListener("pointerup", finish);
      stage.addEventListener("pointerleave", finish);
      el2.addEventListener("click", (e) => {
        const toolBtn = e.target.closest("[data-pe-tool]");
        const colorBtn = e.target.closest("[data-pe-color]");
        const act = e.target.closest("[data-pe]");
        if (toolBtn) {
          tool = toolBtn.dataset.peTool;
          el2.querySelectorAll("[data-pe-tool]").forEach((b) => b.classList.toggle("is-active", b === toolBtn));
          return;
        }
        if (colorBtn) {
          color = colorBtn.dataset.peColor;
          el2.querySelectorAll("[data-pe-color]").forEach((b) => b.classList.toggle("is-active", b === colorBtn));
          return;
        }
        if (!act) return;
        const a = act.dataset.pe;
        if (a === "close") {
          el2.remove();
          this.peEl = null;
        }
        if (a === "undo") {
          if (!undoStack.length) return;
          const prev = undoStack.pop();
          redoStack.push(shapes.slice());
          shapes.length = 0;
          shapes.push(...prev);
          renderShapes();
        }
        if (a === "redo") {
          if (!redoStack.length) return;
          const next = redoStack.pop();
          undoStack.push(shapes.slice());
          shapes.length = 0;
          shapes.push(...next);
          renderShapes();
        }
        if (a === "addPrompt") {
          const hint = `\u5728\u753B\u9762\u4E2D\u6807\u6CE8\u4E86 ${shapes.length} \u5904\uFF08${[...new Set(shapes.map((s) => s.type))].join("/")}\uFF09\uFF0C\u8BF7\u6309\u6807\u6CE8\u533A\u57DF\u4FEE\u6539\u3002`;
          store.transaction((s) => {
            const n = s.nodes.find((x) => x.id === node.id);
            if (n) n.data = { ...n.data, prompt: `${(n.data.prompt || "").replace(/[，,。]$/, "")}${n.data.prompt ? "\uFF0C" : ""}${hint}` };
          }, { history: true, reason: "precision-prompt" });
          store.emit("toast", "\u5DF2\u52A0\u5165\u63D0\u793A\u8BCD", "success");
        }
        if (a === "submit") {
          store.transaction((s) => {
            const n = s.nodes.find((x) => x.id === node.id);
            if (n) n.data = { ...n.data, edits: shapes.slice() };
          }, { history: true, reason: "precision-edit" });
          el2.remove();
          this.peEl = null;
          store.emit("toast", `\u5DF2\u4FDD\u5B58 ${shapes.length} \u5904\u6807\u6CE8\uFF08\u672C\u5730\uFF09`, "success");
        }
      });
      el2.querySelector('[data-pe-tool="arrow"]').classList.add("is-active");
      el2.querySelector('[data-pe-color="#f87171"]').classList.add("is-active");
      renderShapes();
    }
    /* ══════════ 全部生成历史（historyPanel.*） ══════════ */

          if (!media && !v.prompt) continue;
          items.push({
            nodeId: node.id,
            nodeTitle: nodeTitle(node),
            type: v.kind === "video" || node.type.includes("video") ? "video" : "image",
            idx: i,
            media,

            model: v.model || "",
            at: v.at || 0
          });
        }
      }
      if (this.globalHistoryEl) this.globalHistoryEl.remove();
      const tabs = ["all", "image", "video"];
      let tab = "all";
      const el2 = document.createElement("div");
      el2.className = "history-overlay";
      el2.innerHTML = `
      <div class="history-overlay__panel">
        <header class="history-overlay__head">
          <div><h3>\u5168\u90E8\u751F\u6210\u5386\u53F2</h3><span class="history-overlay__sub" id="ghSub">${items.length} \u4E2A\u7ED3\u679C</span></div>
          <div class="history-overlay__actions">
            ${tabs.map((t) => `<button class="btn" data-gh-tab="${t}">${{ all: "\u5168\u90E8", image: "\u56FE\u7247", video: "\u89C6\u9891" }[t]}</button>`).join("")}

        <div class="history-overlay__grid" id="ghGrid"></div>
      </div>`;
      document.body.appendChild(el2);
      this.globalHistoryEl = el2;
      const render = () => {
        const list = items.filter((i) => tab === "all" || i.type === tab);
        el2.querySelector("#ghSub").textContent = `${list.length} \u4E2A\u7ED3\u679C`;
        el2.querySelectorAll("[data-gh-tab]").forEach((b) => b.classList.toggle("is-active", b.dataset.ghTab === tab));

                <span class="history-card__media">${i.media ? `<img src="${i.media}" alt="" />` : '<span class="history-card__empty">\u65E0\u5A92\u4F53</span>'}</span>

                <span class="history-card__prompt">${escapeHTML2(i.prompt || "\u65E0\u63D0\u793A\u8BCD")}</span>
              </button>`
        ).join("") : '<div class="asset-library__empty">\u8FD8\u6CA1\u6709\u751F\u6210\u5386\u53F2</div>';
        el2.querySelectorAll("[data-gh-item]").forEach((card, k) => {
          card.addEventListener("click", () => {
            const item = list[k];
            const node = store.getNode(item.nodeId);
            setMainVersion(item.nodeId, item.idx);
            if (node) {
              store.setSelection([node.id]);
              this.vp.focusNode(node);
            }
            el2.remove();
            this.globalHistoryEl = null;
            store.emit("toast", "\u5DF2\u5B9A\u4F4D\u5E76\u8BBE\u4E3A\u4E3B\u56FE", "success");
          });
        });
      };
      el2.addEventListener("click", (e) => {
        if (e.target === el2 || e.target.closest('[data-gh="close"]')) {
          el2.remove();

        if (e.target.closest('[data-gh="download"]')) {

        setNodeParams(node.id, { model: recommended });

        const btn = e.target.closest("[data-pb]");
        if (!btn) return;
        const node = store.getNode(this.paramNodeId);
        if (!node) return;
        const act = btn.dataset.pb;
        if (act === "close") this.closeParamBar();
        if (act === "run") this.canvas.runNode(node.id);
        if (act === "enhance") this.enhancePrompt(node);
        if (act === "history") this.openHistoryOverlay(node);
        if (act === "recommend") this.applyRecommendedModel(node, true);
      });
      const prompt = bar.querySelector("#pbPrompt");
      prompt.addEventListener("input", () => {
        if (!this.paramNodeId) return;
        store.transaction((s) => {
          const n = s.nodes.find((x) => x.id === this.paramNodeId);
          if (n) n.data = { ...n.data, prompt: prompt.value };
        }, { history: false, reason: "prompt" });
      });
      bar.querySelector("#pbControls").addEventListener("change", (e) => {
        const key = e.target.dataset.param;
        if (!key || !this.paramNodeId) return;
        let value = e.target.value;
        if (e.target.type === "number" || typeof nodeParams(store.getNode(this.paramNodeId))[key] === "number") {
          const n = Number(value);
          if (!Number.isNaN(n)) value = n;
        }
        setNodeParams(this.paramNodeId, { [key]: value });
      });
      this.canvas.host.appendChild(bar);
      this.paramBar = bar;
      this.paramNodeId = null;
    }
    openParamBar(id) {
      if (store.state.settings.readMode) return;
      const node = store.getNode(id);
      if (!node || node.type === "group" || node.type === "comment") return;
      this.paramNodeId = id;
      this.paramBar.hidden = false;
      this.syncParamBar();
    }
    closeParamBar() {
      this.paramBar.hidden = true;
      this.paramNodeId = null;
    }
    syncParamBar() {
      if (!this.paramBar || this.paramBar.hidden) return;
      const selected = store.selectedNodes();
      if (store.state.settings.readMode || selected.length === 1 && selected[0].id !== this.paramNodeId) {
        this.paramNodeId = selected.length === 1 ? selected[0].id : null;
        if (!this.paramNodeId) return this.closeParamBar();
      }
      const node = store.getNode(this.paramNodeId);
      if (!node) {
        this.closeParamBar();
        return;
      }
      const t = NODE_TYPES[node.type] || {};
      const params2 = nodeParams(node);
      this.paramBar.querySelector("#pbTitle").textContent = nodeTitle(node);
      this.paramBar.querySelector("#pbType").textContent = t.name || node.type;
      const prompt = this.paramBar.querySelector("#pbPrompt");
      if (document.activeElement !== prompt) prompt.value = node.data?.prompt || "";
      prompt.placeholder = node.type === "audio" ? "\u63CF\u8FF0\u58F0\u97F3\u3001\u8BED\u6C14\u6216\u6B4C\u8BCD\u2026" : "\u63CF\u8FF0\u4F60\u60F3\u751F\u6210\u7684\u753B\u9762\u3001\u955C\u5934\u6216\u58F0\u97F3\u2026";
      const controls = this.paramBar.querySelector("#pbControls");
      controls.innerHTML = (this.paramSchema(node) || []).filter((f) => f && (f.type !== "select" || Array.isArray(f.options) && f.options.length)).map((f) => {
        const value = params2[f.key] ?? "";
        if (f.type === "select") {
          return `<label class="param-field"><span>${f.label}</span><select data-param="${f.key}">${f.options.map((o) => `<option value="${o}"${String(o) === String(value) ? " selected" : ""}>${o}</option>`).join("")}</select></label>`;
        }
        return `<label class="param-field"><span>${f.label}</span><input data-param="${f.key}" type="${f.type}" value="${escapeHTML2(
          String(value)
        )}" placeholder="${f.placeholder || ""}" /></label>`;
      }).join("");
      const kind = this.modelKind(node);
      if (kind) {
        const hasRefs = this.nodeHasRefs(node);
        const available = api.modelsFor(kind, { hasRefs });
        const current = params2.model;
        if (available.length && (!available.includes(current) || hasRefs && !api.supportsRef(current))) {
          const rec = api.recommend(kind, { hasRefs });
          if (rec && rec !== current) {
            setNodeParams(node.id, { model: rec });
            this.paramBar.querySelectorAll('[data-param="model"]').forEach((sel) => {
              if ([...sel.options].some((o) => o.value === rec)) sel.value = rec;
            });
          }
        }
      }
      const modelSel = this.paramBar.querySelector('[data-param="model"]');
      const hintEl = this.paramBar.querySelector(".param-hint");
      if (hintEl && node && kind) {
        const model = nodeParams(node).model;
        const chips = api.modelChips(model);
        const hasRefs = this.nodeHasRefs(node);
        const refOk = api.supportsRef(model);
        hintEl.innerHTML = `
        <span class="param-hint__rec">\u5DF2\u6309\u300C${{ image: "\u51FA\u56FE", video: "\u89C6\u9891", text: "\u6587\u672C", audio: "\u97F3\u9891" }[kind]}\u300D\u7C7B\u522B\u7B5B\u9009 ${api.modelsFor(kind, { hasRefs }).length} \u4E2A\u53EF\u7528\u6A21\u578B</span>
        ${chips.length ? `<span class="param-hint__chips">${chips.map((c) => `<i>${c}</i>`).join("")}</span>` : ""}
        ${hasRefs && !refOk ? '<span class="param-hint__warn">\u8BE5\u6A21\u578B\u4E0D\u652F\u6301\u53C2\u8003\u56FE\uFF0C\u751F\u6210\u65F6\u4F1A\u5FFD\u7565\u4E0A\u6E38\u56FE\u7247</span>' : hasRefs ? '<span class="param-hint__ok">\u2713 \u652F\u6301\u4F7F\u7528\u4E0A\u6E38\u56FE\u7247\u4F5C\u4E3A\u53C2\u8003</span>' : ""}`;
      }
      const runBtn = this.paramBar.querySelector('[data-pb="run"]');
      runBtn.disabled = node.data?.status === "running";
    }
    enhancePrompt(node) {
      const current = String(node.data?.prompt || "").trim();
      const params2 = nodeParams(node);
      const style = params2.style ? `${params2.style}\uFF0C` : "";
      const extras = node.type.includes("video") ? "\u7F13\u6162\u63A8\u8FDB\uFF0C\u6D45\u666F\u6DF1\uFF0C\u7A33\u5B9A\u8FD0\u955C\uFF0C\u7535\u5F71\u7EA7\u8C03\u8272" : node.type === "audio" ? "\u6E05\u6670\u5C42\u6B21\uFF0C\u7A7A\u95F4\u611F\uFF0C\u65E0\u7206\u97F3" : "\u9AD8\u7EC6\u8282\uFF0C\u4F53\u79EF\u5149\uFF0C35mm \u80F6\u7247\u8D28\u611F\uFF0C8K";
      const next = current ? `${current.replace(/[，,。]$/, "")}\uFF0C${style}${extras}` : `${style}${extras}`;
      store.transaction((s) => {
        const n = s.nodes.find((x) => x.id === node.id);
        if (n) n.data = { ...n.data, prompt: next };
      }, { history: true, reason: "prompt-enhance" });
      this.paramBar.querySelector("#pbPrompt").value = next;
      store.emit("toast", "\u63D0\u793A\u8BCD\u5DF2\u589E\u5F3A\uFF08\u672C\u5730\u6A21\u677F\uFF09", "success");
    }
    /* ══════════ 本地素材库（assetLibrary 的本地版本） ══════════ */
    buildAssetLibrary() {
      const el2 = document.createElement("aside");
      el2.className = "asset-library";
      el2.id = "assetLibrary";
      el2.hidden = true;
      el2.innerHTML = `
      <div class="asset-library__head">
        <div><span class="asset-library__title">\u7D20\u6750\u5E93</span><span class="asset-library__count" id="alCount"></span></div>
        <button class="icon-btn icon-btn--ghost" id="alClose" title="\u5173\u95ED">${icon2("close")}</button>
      </div>
      <div class="asset-library__tabs">
        <button class="is-active" data-al-tab="all">\u5168\u90E8</button>
        <button data-al-tab="image">\u56FE\u7247</button>
        <button data-al-tab="video">\u89C6\u9891</button>
        <button data-al-tab="audio">\u97F3\u9891</button>
      </div>
      <label class="asset-library__search">${icon2("search")}<input id="alSearch" placeholder="\u641C\u7D22\u7D20\u6750\u2026" spellcheck="false" /></label>
      <div class="asset-library__grid" id="alGrid"></div>
      <div class="asset-library__foot">\u70B9\u51FB\u9884\u89C8 \xB7 \u53CC\u51FB\u5B9A\u4F4D\u8282\u70B9 \xB7 \u62D6\u5230\u753B\u5E03\u6DFB\u52A0</div>`;
      this.canvas.host.appendChild(el2);
      this.assetLibrary = el2;
      this.alTab = "all";
      this.alQuery = "";
      el2.querySelector("#alClose").addEventListener("click", () => this.toggleAssetLibrary(false));
      el2.querySelectorAll("[data-al-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          this.alTab = btn.dataset.alTab;
          this.renderAssetLibrary();
        });
      });
      el2.querySelector("#alSearch").addEventListener("input", (e) => {
        this.alQuery = e.target.value;
        this.renderAssetLibrary();
      });
    }
    toggleAssetLibrary(open) {
      const next = open == null ? this.assetLibrary.hidden : open;
      this.assetLibrary.hidden = !next;
      if (next) {
        this.closeParamBar();
        this.hideMediaToolbar();
        this.renderAssetLibrary();
      }
    }
    assetItems() {
      const items = [];
      for (const node of store.nodes) {
        if (node.type === "group" || node.type === "comment") continue;
        const t = NODE_TYPES[node.type] || {};
        if (node.data?.media) {
          items.push({
            id: `${node.id}:main`,
            nodeId: node.id,
            type: node.type.includes("video") ? "video" : "image",
            media: node.data.media,
            label: nodeTitle(node),
            model: node.data?.model || "",
            at: node.data?.history?.[Number(node.data.mainIndex) || 0]?.at || null
          });
        } else if (node.data?.poster) {
          items.push({
            id: `${node.id}:poster`,
            nodeId: node.id,
            type: node.type.includes("video") ? "video" : "image",
            media: node.data.poster,
            label: nodeTitle(node),
            model: node.data?.model || "",
            at: null
          });
        }
        for (const [i, v] of (node.data?.history || []).entries()) {
          const media = v.media || v.poster;
          if (!media) continue;
          items.push({
            id: `${node.id}:h${i}`,
            nodeId: node.id,
            type: v.kind === "video" ? "video" : "image",
            media,
            label: `${nodeTitle(node)} \xB7 \u5386\u53F2 ${i + 1}`,
            model: v.model || "",
            at: v.at || null
          });
        }
        if (node.type === "audio") items.push({ id: `${node.id}:audio`, nodeId: node.id, type: "audio", media: "", label: nodeTitle(node), model: node.data?.model || "", at: null });
      }
      return items;
    }
    renderAssetLibrary() {
      if (!this.assetLibrary) return;
      const q = (this.alQuery || "").trim().toLowerCase();
      const all = this.assetItems();
      const counts = {
        all: all.length,
        image: all.filter((i) => i.type === "image").length,
        video: all.filter((i) => i.type === "video").length,
        audio: all.filter((i) => i.type === "audio").length
      };
      this.assetLibrary.querySelector("#alCount").textContent = String(all.length);
      this.assetLibrary.querySelectorAll("[data-al-tab]").forEach((b) => {
        b.classList.toggle("is-active", b.dataset.alTab === this.alTab);
        b.textContent = `${{ all: "\u5168\u90E8", image: "\u56FE\u7247", video: "\u89C6\u9891", audio: "\u97F3\u9891" }[b.dataset.alTab]} ${counts[b.dataset.alTab] || ""}`.trim();
      });
      const items = all.filter(
        (i) => (this.alTab === "all" || i.type === this.alTab) && (!q || i.label.toLowerCase().includes(q) || i.model.toLowerCase().includes(q))
      );
      const grid = this.assetLibrary.querySelector("#alGrid");
      grid.innerHTML = "";
      if (!items.length) {
        grid.innerHTML = '<div class="asset-library__empty">\u8FD8\u6CA1\u6709\u7D20\u6750\uFF0C\u62D6\u56FE\u7247/\u89C6\u9891\u8FDB\u753B\u5E03\u6216\u5148\u70B9\u300C\u751F\u6210\u300D</div>';
        return;
      }
      for (const item of items) {
        const cell = document.createElement("button");
        cell.className = "asset-cell";
        cell.draggable = true;
        cell.innerHTML = `
        <span class="asset-cell__thumb">${item.media ? `<img src="${item.media}" alt="" />` : `<span class="asset-cell__audio">${icon2("audio")}</span>`}${item.type === "video" ? `<span class="asset-cell__badge">\u89C6\u9891</span>` : ""}</span>
        <span class="asset-cell__label">${escapeHTML2(item.label)}</span>`;
        cell.addEventListener("click", () => {
          const node = store.getNode(item.nodeId);
          if (node) {
            store.setSelection([node.id]);
            this.vp.focusNode(node);
          }
        });
        cell.addEventListener("dblclick", () => this.openMediaPreview(store.getNode(item.nodeId)));
        cell.addEventListener("dragstart", (e) => {
          e.dataTransfer.setData(
            "application/x-canvas-asset",
            JSON.stringify({ media: item.media, type: item.type, label: item.label, model: item.model })
          );
          e.dataTransfer.effectAllowed = "copy";
        });
        grid.appendChild(cell);
      }
    }
    /* ══════════ 媒体预览（mediaPreview.*） ══════════ */
    openMediaPreview(node) {
      if (!node) return;
      const media = nodeMainMedia(node) || node.data?.poster || "";
      if (!media) {
        store.emit("toast", "\u8FD9\u4E2A\u8282\u70B9\u8FD8\u6CA1\u6709\u53EF\u9884\u89C8\u7684\u5A92\u4F53", "error");
        return;
      }
      const t = NODE_TYPES[node.type] || {};
      const ver = nodeCurrentVersion(node);
      if (this.previewEl) this.previewEl.remove();
      const el2 = document.createElement("div");
      el2.className = "preview-overlay";
      el2.innerHTML = `
      <div class="preview-overlay__panel">
        <header class="preview-overlay__head">
          <div>
            <h3>${escapeHTML2(nodeTitle(node))}</h3>
            <span>${t.name || node.type}${node.type.includes("video") ? " \xB7 \u4EE5\u5173\u952E\u5E27\u9884\u89C8" : ""}</span>
          </div>
          <div class="preview-overlay__actions">
            <button class="btn" data-pv="download">\u4E0B\u8F7D</button>
            <button class="btn" data-pv="history">\u751F\u6210\u5386\u53F2</button>
            <button class="btn" data-pv="close">\u5173\u95ED</button>
          </div>
        </header>
        <div class="preview-overlay__media">${node.type.includes("video") && /^https?:.*\.(mp4|webm|mov)/i.test(media) ? `<video src="${media}" controls autoplay playsinline></video>` : `<img src="${media}" alt="" />`}</div>
        <div class="preview-overlay__info">
          <div class="info-row"><span>\u540D\u79F0</span><b>${escapeHTML2(nodeTitle(node))}</b></div>
          <div class="info-row"><span>\u7C7B\u578B</span><b>${escapeHTML2(t.name || node.type)}</b></div>
          <div class="info-row"><span>\u6765\u6E90</span><b>${node.data?.history?.length ? "\u672C\u5730\u751F\u6210" : "\u5BFC\u5165 / \u4E0A\u4F20"}</b></div>
          <div class="info-row"><span>\u6A21\u578B</span><b>${escapeHTML2(ver?.model || node.data?.model || "\u2014")}</b></div>
          <div class="info-row"><span>\u5B8C\u6210\u65F6\u95F4</span><b>${ver?.at ? new Date(ver.at).toLocaleString("zh-CN") : "\u2014"}</b></div>
        </div>
      </div>`;
      el2.addEventListener("click", (e) => {
        if (e.target === el2) this.closePreview();
        const btn = e.target.closest("[data-pv]");
        if (!btn) return;
        if (btn.dataset.pv === "close") this.closePreview();
        if (btn.dataset.pv === "download") this.downloadNodeMedia(node);
        if (btn.dataset.pv === "history") {
          this.closePreview();
          this.openHistoryOverlay(node);
        }
      });
      document.body.appendChild(el2);
      this.previewEl = el2;
    }
    closePreview() {
      if (this.previewEl) {
        this.previewEl.remove();
        this.previewEl = null;
      }
    }
    /* ══════════ 图片/视频节点工具条（逆向 imageToolbar.* 的本地子集） ══════════ */
    buildMediaToolbar() {
      const bar = document.createElement("div");
      bar.className = "media-toolbar";
      bar.hidden = true;
      bar.innerHTML = `
      <button data-mt="download" title="\u4E0B\u8F7D">${icon2("download")}</button>
      <button data-mt="copy" title="\u590D\u5236\u56FE\u7247">${icon2("copy")}</button>
      <span class="media-toolbar__sep"></span>
      <button data-mt="flipx" title="\u6C34\u5E73\u7FFB\u8F6C">${icon2("chevron")}</button>
      <button data-mt="flipy" title="\u5782\u76F4\u7FFB\u8F6C">${icon2("chevron")}</button>
      <button data-mt="rotate" title="\u65CB\u8F6C 90\xB0">${icon2("refresh")}</button>
      <span class="media-toolbar__sep"></span>
      <button data-mt="adjust" title="\u8C03\u6574\u989C\u8272">${icon2("magnet")}</button>
      <button data-mt="crop" title="\u88C1\u526A">${icon2("fit")}</button>
      <button data-mt="precision" title="\u7CBE\u786E\u7F16\u8F91\uFF08\u89C6\u9891\uFF09">${icon2("comment")}</button>
      <button data-mt="history" title="\u751F\u6210\u5386\u53F2">${icon2("layers")}</button>
      <button data-mt="info" title="\u5A92\u4F53\u4FE1\u606F">${icon2("search")}</button>
      <span class="media-toolbar__sep"></span>
      <button data-mt="annotate" title="\u6807\u6CE8">${icon2("comment")}</button>`;
      bar.addEventListener("pointerdown", (e) => e.stopPropagation());
      bar.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-mt]");
        if (!btn || !this.mediaToolbarNode) return;
        const node = store.getNode(this.mediaToolbarNode);
        if (!node) return;
        const act = btn.dataset.mt;
        if (act === "download") this.downloadNodeMedia(node);
        if (act === "copy") this.copyNodeImage(node);
        if (act === "flipx") setNodeFilter(node.id, { flipX: !nodeFilters(node).flipX });
        if (act === "flipy") setNodeFilter(node.id, { flipY: !nodeFilters(node).flipY });
        if (act === "rotate") setNodeFilter(node.id, { rotate: (nodeFilters(node).rotate || 0) + 90 });
        if (act === "adjust") this.toggleAdjustPopover(node);
        if (act === "crop") this.startCrop(node);
        if (act === "precision") this.openPrecisionEdit(node);
        if (act === "history") this.openHistoryOverlay(node);
        if (act === "recommend") this.applyRecommendedModel(node, true);
        if (act === "info") this.showMediaInfo(node);
        if (act === "annotate") {
          store.setSetting("annotateMode", true);
          store.emit("toast", "\u6807\u6CE8\u6A21\u5F0F\uFF1A\u62D6\u62FD\u753B\u7BAD\u5934\uFF0C\u6216\u5207\u5230\u6587\u5B57\u5DE5\u5177\u70B9\u51FB\u753B\u5E03");
        }
      });
      this.canvas.host.appendChild(bar);
      this.mediaToolbar = bar;
      this.mediaToolbarNode = null;
      this.mediaHoverTimer = null;
      this.canvas.host.addEventListener("pointermove", (e) => this.updateMediaToolbar(e));
      this.canvas.host.addEventListener("pointerleave", () => {
        if (this.mediaToolbar && !this.mediaToolbar.matches(":hover")) this.hideMediaToolbar();
      });
    }
    updateMediaToolbar(e) {
      if (store.state.settings.readMode || store.state.settings.annotateMode) return this.hideMediaToolbar();
      if (this.canvas.interaction?.type === "drag" || this.canvas.interaction?.type === "connect") return this.hideMediaToolbar();
      if (e.target.closest(".media-toolbar, .adjust-popover, .annotate-bar, .menu")) return;
      const nodeEl = e.target.closest(".node");
      if (!nodeEl) {
        clearTimeout(this.mediaHoverTimer);
        this.mediaHoverTimer = setTimeout(() => {
          if (!this.mediaToolbar.matches(":hover")) this.hideMediaToolbar();
        }, 220);
        return;
      }
      const id = nodeEl.dataset.id;
      const node = store.getNode(id);
      if (!node || node.type === "group" || node.type === "comment") return this.hideMediaToolbar();
      this.mediaToolbarNode = id;
      this.positionMediaToolbar(node);
      this.mediaToolbar.hidden = false;
    }
    /** 浮动工具条不要压住顶部标题栏（header 高度约 60） */
    safeToolbarTop(top, height, scale) {
      const minTop = 64 + height * scale + 8;
      const maxTop = this.canvas.host.clientHeight - 8;
      return Math.max(minTop, Math.min(maxTop, top));
    }
    /** 浮动工具条不要跑出左右边界（节点/编组在视口外时贴边显示） */
    safeToolbarLeft(left, width, scale) {
      const half = width * scale / 2;
      const minLeft = 72 + half;
      const maxLeft = this.canvas.host.clientWidth - 16 - half;
      return Math.max(minLeft, Math.min(maxLeft, left));
    }
    positionMediaToolbar(node) {
      const w = node.w || 380;
      const local = this.vp.flowToLocal(node.x + w / 2, node.y);
      const scale = this.canvas.uiScale ? this.canvas.uiScale() : Math.max(0.4, Math.min(1, this.vp.zoom));
      const selected = store.selectedNodes();
      const nodeToolbarVisible = this.canvas.toolbar && !this.canvas.toolbar.hidden && selected.length === 1 && selected[0].id === node.id;
      const lift = nodeToolbarVisible ? 30 * scale + 8 : 0;
      this.mediaToolbar.style.left = `${this.safeToolbarLeft(local.x, this.mediaToolbar.offsetWidth || 290, scale)}px`;
      this.mediaToolbar.style.top = `${this.safeToolbarTop(local.y - 8 - lift, 30, scale)}px`;
      this.mediaToolbar.style.transform = `translate(-50%, -100%) scale(${scale})`;
      this.mediaToolbar.style.transformOrigin = "50% 100%";
    }
    hideMediaToolbar() {
      if (this.mediaToolbar) this.mediaToolbar.hidden = true;
      this.mediaToolbarNode = null;
    }
    async downloadNodeMedia(node) {
      const media = nodeMainMedia(node) || node.data?.poster || "";
      if (!media) {
        store.emit("toast", "\u8BE5\u8282\u70B9\u8FD8\u6CA1\u6709\u53EF\u4E0B\u8F7D\u7684\u5A92\u4F53", "error");
        return;
      }
      const isVideo = node.type.includes("video") || node.data?.kind === "video";
      const ext = isVideo ? "mp4" : media.startsWith("data:image/svg") ? "svg" : "png";
      const name = `${sanitize(nodeTitle(node))}.${ext}`;
      if (/^https?:/.test(media)) {
        try {
          const blob = await (await fetch(media)).blob();
          const url = URL.createObjectURL(blob);
          const a2 = document.createElement("a");
          a2.href = url;
          a2.download = name;
          a2.click();
          setTimeout(() => URL.revokeObjectURL(url), 4e3);
          store.emit("toast", "\u5DF2\u5F00\u59CB\u4E0B\u8F7D", "success");
          return;
        } catch {
          window.open(media, "_blank", "noopener");
          store.emit("toast", "\u5DF2\u5728\u65B0\u6807\u7B7E\u9875\u6253\u5F00\uFF08\u8DE8\u57DF\u8D44\u6E90\uFF09");
          return;
        }
      }
      const a = document.createElement("a");
      a.href = media;
      a.download = name;
      a.click();
      store.emit("toast", "\u5DF2\u5F00\u59CB\u4E0B\u8F7D", "success");
    }
    async copyNodeImage(node) {
      const media = nodeMainMedia(node);
      if (!media) {
        store.emit("toast", "\u8BE5\u8282\u70B9\u8FD8\u6CA1\u6709\u56FE\u7247", "error");
        return;
      }
      if (node.type.includes("video")) {
        store.emit("toast", "\u89C6\u9891\u8282\u70B9\u4E0D\u652F\u6301\u590D\u5236\u56FE\u7247", "error");
        return;
      }
      try {
        const blob = await dataURLToPngBlob(media);
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        store.emit("toast", "\u56FE\u7247\u5DF2\u590D\u5236\u5230\u526A\u8D34\u677F", "success");
      } catch (err) {
        store.emit("toast", "\u590D\u5236\u5931\u8D25\uFF08\u9700\u8981\u526A\u8D34\u677F\u6743\u9650\uFF09", "error");

    /* ── 生成历史浮层（nodeOutputHistory.*） ────────────────────────── */
    openHistoryOverlay(node) {
